<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTPLORER - Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
      body { overflow: auto; }
  </style>
</head>
<body>
    <header class="main" style="height:auto; min-height:100vh; padding: 60px 20px;">
      <div class="main-content">
            <h1 class="main-title">LEADERBOARD</h1>
            <p class="subtitle">- Top 10 Times Per Level -</p>

            <div id="leaderboard-container" style="margin-top: 40px; width: 100%; max-width: 600px;">
                <p style="color:#555;">Loading...</p>
            </div>

            <a class="menu-btn" href="levels.html" style="margin-top: 40px;">← Back</a>
        </div>
    </header>

    <!-- Menu background: falling rainbow letters -->
    <script src="menu-bg.js"></script>

    <script>
    const levelKeys = ['easy', 'medium', 'hard', 'veryhard', 'impossible'];
    const levelLabels = {
        easy: 'Easy',
        medium: 'Medium',
        hard: 'Hard',
        veryhard: 'Very Hard',
        impossible: 'Impossible'
    };

    async function loadLeaderboards() {
        const container = document.getElementById('leaderboard-container');
        container.innerHTML = '';

        for (const key of levelKeys) {
            const scores = await fetch('/api/get-scores?level=' + key).then(r => r.json());

            const section = document.createElement('div');
            section.style.cssText = 'margin-bottom: 40px; text-align: left;';

            const title = document.createElement('h3');
            title.textContent = levelLabels[key];
            title.style.cssText = 'color:#9cb4f1; font-family:"Courier New",monospace; border-bottom: 1px solid #333; padding-bottom: 8px;';
            section.appendChild(title);

            if (scores.length === 0) {
                const empty = document.createElement('p');
                empty.textContent = 'No times yet.';
                empty.style.color = '#555';
                section.appendChild(empty);
            } else {
                scores.slice(0, 10).forEach((s, i) => {
                    const row = document.createElement('p');
                    row.style.cssText = 'margin: 6px 0; color:#ccc; font-family:"Courier New",monospace;';
                    row.textContent = (i + 1) + '.  ' + s.name.padEnd(20) + '  ' + s.time.toFixed(3) + 's';
                    section.appendChild(row);
                });
            }

            container.appendChild(section);
        }
    }

    loadLeaderboards();
    </script>
</body>
</html>
