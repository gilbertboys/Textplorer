<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTPLORER - Select Level</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main">
        <div class="main-content">
            <h1 class="main-title">SELECT LEVEL</h1>
            <p class="subtitle">- Choose Your Challenge -</p>

            <nav class="main-menu">
                <ul>
                    <li><a class="menu-btn" id="easyBtn">Easy</a></li>
                    <li><a class="menu-btn" id="mediumBtn">Medium</a></li>
                    <li><a class="menu-btn" id="hardBtn">Hard</a></li>
                    <li><a class="menu-btn" id="veryhardBtn">Very Hard</a></li>
                    <li><a class="menu-btn" id="impossibleBtn">Impossible</a></li>
                </ul>
            </nav>

            <a class="menu-btn" href="index.html" style="margin-top: 20px;">← Back</a>
        </div>
    </header>

    <div id="game-container" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
    <script src="game.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const gameContainer = document.getElementById('game-container');
        const mainHeader = document.querySelector('header.main');

        const levels = {
            easyBtn:       'easy',
            mediumBtn:     'medium',
            hardBtn:       'hard',
            veryhardBtn:   'veryhard',
            impossibleBtn: 'impossible'
        };

        Object.entries(levels).forEach(([btnId, levelKey]) => {
            document.getElementById(btnId).addEventListener('click', async function (e) {
                e.preventDefault();
                try {
                    const response = await fetch('/api/load-sample-level?level=' + levelKey);
                    if (!response.ok) { alert('Failed to load level'); return; }
                    const levelData = await response.json();

                    currentLevelData = levelData;
                    mainHeader.style.display = 'none';
                    gameContainer.style.display = 'flex';
                    document.body.style.overflow = 'hidden';

                    game.scene.stop('default');
                    game.scene.start('default', { levelData: levelData });
                } catch (err) {
                    alert('Error: ' + err.message);
                }
            });
        });
    });
    </script>
</body>
</html>
