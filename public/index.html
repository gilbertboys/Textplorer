<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXTPLORER - Platformer VideoGame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main">
        <div class="main-content">
            <h1 class="main-title">TEXTPLORER</h1>
            <p class="subtitle">- Take .txt Files to a <u><b>Whole New Level</b></u> -</p>
            
            <nav class="main-menu">
                <ul>
                    <li><a class="menu-btn">Levels</a></li>
                    <li><a class="menu-btn" id="uploadMenuBtn">Upload Level</a></li>
                    <li><a class="menu-btn">About</a></li>
                    <li><a class="menu-btn">Source Code</a></li>
                </ul>
            </nav>

            <!-- Upload Panel (hidden until user clicks "Upload Level") -->
            <div id="uploadPanel" class="upload-panel">
                <input id="levelFile" type="file" accept=".txt" />
                <button id="uploadBtn" class="menu-btn">Parse Level</button>

                <p id="status" class="upload-status"></p>

                <pre id="output" class="upload-output"></pre>
            </div>

        </div>
    </header>

    <footer class="site-footer">
        <p>&copy; Textplorer Co.</p>
        <p>Jacob Munly, Norman Nomie, Drew Inglesby, Jack Dunlap</p>
    </footer>

    <!-- JS for Upload Level UI -->
    <script src="parser-ui.js"></script>

</body>
</html>
